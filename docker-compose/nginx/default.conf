server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/public;

    proxy_connect_timeout 300;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    fastcgi_read_timeout 300;

    # Set up the /palaro path
    location /palaro {
        alias /var/www/public;
        try_files $uri $uri/ @palaro;
    }

    location @palaro {
        rewrite /palaro/(.*)$ /index.php?/$1 last;
    }

    # Handle Vite assets during development
    location ^~ /@vite/ {
        proxy_pass http://vite:5173;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept' always;
    }
    
    # Main location block for Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # Handle all other static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp)$ {
        try_files $uri $uri/ /index.php?$query_string;
        expires max;
        add_header Cache-Control "public, max-age=31536000";
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}