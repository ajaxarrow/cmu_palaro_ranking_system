<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        :root {
            --primary-color: #380505;
            --secondary-color: #fef202;
            --tertiary-color: #ff7605;
            --quaternary-color: #920000;
            --quinary-color: #fff7f7;
            --liner-gradient: linear-gradient(
                to bottom,
                rgba(78, 3, 3, 0.788) 0%,
                rgba(43, 1, 1, 0.986) 80%,
                rgba(43, 1, 1, 0.986) 100%
            );
            --champ-section-top-fade: linear-gradient(rgba(43, 1, 1, 0.986), rgba(255, 166, 0, 0));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: var(--primary-color);
            color: var(--quinary-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .error-card {
            background-color: rgba(56, 5, 5, 0.4);
            border-left: 4px solid var(--tertiary-color);
            border-radius: 12px;
            padding: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            width: 100%;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: var(--quinary-color);
            letter-spacing: -2px;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .error-code span {
            color: var(--tertiary-color);
        }

        .error-message {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--secondary-color);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .error-description {
            font-size: 1rem;
            margin-bottom: 2rem;
            line-height: 1.6;
            color: var(--quinary-color);
            opacity: 0.8;
        }

        .scoreboard {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .team {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .team-name {
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0.9;
        }

        .score-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 2.5rem;
            font-weight: 700;
        }

        .score {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--quaternary-color);
            color: var(--quinary-color);
            border-radius: 8px;
        }

        .score-separator {
            font-size: 1.5rem;
            opacity: 0.6;
        }

        .missing-score {
            position: relative;
            background-color: rgba(146, 0, 0, 0.3);
            color: transparent;
        }

        .missing-score::after {
            content: "?";
            position: absolute;
            color: var(--tertiary-color);
            font-size: 2rem;
        }

        .icon {
            margin: 30px 0;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 118, 5, 0.2);
            border-radius: 50%;
        }

        .icon svg {
            width: 30px;
            height: 30px;
            fill: var(--tertiary-color);
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background-color: transparent;
            color: var(--quinary-color);
            text-decoration: none;
            font-weight: 500;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--tertiary-color);
            color: var(--primary-color);
            border: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
        }

        @media (max-width: 768px) {
            .error-card {
                padding: 30px 20px;
            }
            
            .error-code {
                font-size: 4rem;
            }
            
            .error-message {
                font-size: 1.2rem;
            }
            
            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-card">
            <div class="error-code">4<span>0</span>4</div>
            <div class="error-message">Page Not Found</div>
            <div class="error-description">
                The page you're looking for is not in play. It may have been moved, deleted, or never existed.
            </div>
            
            <div class="scoreboard">
                <div class="team">
                    <div class="team-name">CURRENT</div>
                    <div class="score">404</div>
                </div>
                <div class="score-separator">:</div>
                <div class="team">
                    <div class="team-name">PAGE</div>
                    <div class="score missing-score">0</div>
                </div>
            </div>
            
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm0 16a2 2 0 110-4 2 2 0 010 4zm2-8.5a2 2 0 01-4 0v-3a2 2 0 114 0v3z"/>
                </svg>
            </div>  
            
            <div class="actions">
                <a href="/" class="btn btn-primary">Return to Homepage</a>
                <a href="javascript:history.back()" class="btn">Go Back</a>
            </div>
        </div>
    </div>
</body>
</html>
