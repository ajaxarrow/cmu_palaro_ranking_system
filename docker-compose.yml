services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cmu-palaro-image
    container_name: cmu-palaro-image
    restart: unless-stopped
    tty: true
    environment:  
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker-compose/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  vite:
      image: node:18
      container_name: cmu-palaro-vite-service
      restart: unless-stopped
      tty: true
      ports:
        - "5173:5173"
      volumes:
        - .:/var/www
      working_dir: /var/www
      command: bash -c "npm install && npm run dev"
      networks:
        - app-network
      extra_hosts:
        - "host.docker.internal:host-gateway"

  webserver:
    image: nginx:alpine
    container_name: cmu-palaro-nginx-webserver
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - .:/var/www
      - ./docker-compose/nginx:/etc/nginx/conf.d/
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
  

networks:
  app-network:
    driver: bridge